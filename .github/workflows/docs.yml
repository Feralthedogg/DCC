name: Docs

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Checkout LLAM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/LLAM
          ref: 7265b339a9364502e1e537a3aec072939e2bdcf9 # v2.2.1
          path: LLAM

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev liburing-dev ninja-build
          python -m pip install -r docs/requirements.txt

      - name: Check generated examples
        run: python tools/sync_doc_examples.py --check

      - name: Build installed-package example
        run: |
          cmake -S . -B build/docs-package -G Ninja \
            -DDCC_LLAM_USE_SUBDIRECTORY=ON \
            -DDCC_LLAM_ROOT="${{ github.workspace }}/LLAM" \
            -DDCC_BUNDLE_LLAM=ON \
            -DDCC_BUILD_TOOLS=OFF \
            -DDCC_WITH_OPUS=OFF
          cmake --build build/docs-package --target dcc
          cmake --install build/docs-package --prefix build/docs-install
          cmake -S examples/docs -B build/docs-example -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/docs-install"
          cmake --build build/docs-example

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: deploy-docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
